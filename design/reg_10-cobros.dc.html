<!doctype html>
<html lang="es">
<head>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#251D44}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #251D44; font-family: 'IBM Plex Sans', system-ui, sans-serif;">
<div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 6px; border-bottom: 1px solid #E4E1EE; flex: none;">
<a href="hub_c_perfil.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #251D44;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="font-size: 16px; font-weight: 700;">Medio de cobro</div>
<span style="width: 44px;"></span>
</div>


<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 18px 20px; overflow: hidden;">
<div><h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em;">¿Dónde cobras?</h1><p style="margin: 6px 0 0; font-size: 15px; color: #5B5670; line-height: 1.45;">Aquí te transferimos lo que ganas con tus viajes.</p></div><label for="cb-b1" style="display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 12px; cursor: pointer; {{ st.cb_b1 }}"><input type="radio" id="cb-b1" name="cb" checked="{{ r.cb_b1 }}" onChange="{{ pick.cb_b1 }}" style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #251D44; flex: none;"><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 600;">Cuenta bancaria</span><span style="font-size: 13px; color: #5B5670; line-height: 1.4;">BCP, Interbank, BBVA o Scotiabank</span></span></label><label for="cb-b2" style="display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 12px; cursor: pointer; {{ st.cb_b2 }}"><input type="radio" id="cb-b2" name="cb" checked="{{ r.cb_b2 }}" onChange="{{ pick.cb_b2 }}" style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #251D44; flex: none;"><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 600;">Billetera</span><span style="font-size: 13px; color: #5B5670; line-height: 1.4;">Yape o Plin</span></span></label><div style="display: flex; flex-direction: column; gap: 6px;"><label for="cta" style="font-size: 14px; font-weight: 600;">Número de cuenta</label><input id="cta" type="text" value="{{ v.cta }}" onChange="{{ set.cta }}" style="height: 48px; box-sizing: border-box; border: 1.5px solid #A9A4BC; border-radius: 10px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #251D44; background: #FFFFFF; width: 100%;  "></div><div style="display: flex; flex-direction: column; gap: 6px;"><label for="tit" style="font-size: 14px; font-weight: 600;">Titular</label><input id="tit" type="text" value="{{ v.tit }}" onChange="{{ set.tit }}" style="height: 48px; box-sizing: border-box; border: 1.5px solid #A9A4BC; border-radius: 10px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #251D44; background: #FFFFFF; width: 100%;  "><div style="font-size: 13px; color: #5B5670; line-height: 1.4;">Debe estar a tu nombre.</div></div><div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: #EEEBFD;"><div style="font-size: 12px; font-weight: 700; color: #5B5670; text-transform: uppercase; letter-spacing: 0.08em;">Tu wallet</div><div style="font-size: 14px; line-height: 1.5;">Tu wallet tiene <b>S/ 124.50</b>. Los viajes con tarjeta la abonan; en los viajes en efectivo se descuenta de ella el servicio de RUTA.</div></div>
</div>
<div style="flex: none; display: flex; flex-direction: column; gap: 10px; padding: 14px 20px 24px; border-top: 1px solid #E4E1EE;">
<a href="hub_c_perfil.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none; box-sizing: border-box; background: #251D44; color: #FFFFFF;">Guardar cambios</a>
</div>
<sc-if value="{{ toast }}" hint-placeholder-val="{{ true }}"><div style="position: absolute; left: 20px; right: 20px; bottom: 96px; display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: #251D44; color: #FFFFFF; font-size: 14px; font-weight: 600;"><span style="display: flex; color: #D1F383;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>Borrador guardado</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  data() { return { INIT: {"v": {"cta": "191-1234567-0-21", "tit": "Marco Salazar"}, "r": {"cb": "b1"}, "c": {}, "count": 0, "toast": false}, CFG: {"opts": {"cb": ["b1", "b2"]}, "stops": [], "lo": 0, "hi": 0, "SEL": "border: 2px solid #251D44; background: #F3FBE1;", "UNSEL": "border: 1.5px solid #E4E1EE; background: #FFFFFF;", "CHON": "background: #D1F383; border: 1.5px solid #251D44; color: #251D44;", "CHOFF": "background: #FFFFFF; border: 1.5px solid #E4E1EE; color: #251D44;", "ERRTA": "border-color: #B3261E; background: #FCEEEE;"} }; }
  cur() {
    var INIT = this.data().INIT;
    var s = this.state || {};
    return {
      v: Object.assign({}, INIT.v, s.v || {}),
      r: Object.assign({}, INIT.r, s.r || {}),
      c: Object.assign({}, INIT.c, s.c || {}),
      count: (s.count === undefined ? INIT.count : s.count),
      toast: !!s.toast
    };
  }
  renderVals() {
    var self = this;
    var CFG = this.data().CFG;
    var s = this.cur();
    function up(key, patch) { var c = self.cur(); var o = {}; o[key] = Object.assign({}, c[key], patch); self.setState(o); }
    var set = {};
    Object.keys(s.v).forEach(function (k) { set[k] = function (e) { var p = {}; p[k] = e.target.value; up('v', p); }; });
    var r = {}, pick = {}, st = {}, cst = {}, apr = {};
    Object.keys(CFG.opts).forEach(function (g) {
      CFG.opts[g].forEach(function (id) {
        var k = g + '_' + id, on = s.r[g] === id;
        r[k] = on; st[k] = on ? CFG.SEL : CFG.UNSEL; cst[k] = on ? CFG.CHON : CFG.CHOFF; apr[k] = on ? 'true' : 'false';
        pick[k] = function () { var p = {}; p[g] = id; up('r', p); };
      });
    });
    var c = {}, n = {}, tog = {}, cs = {}, ap = {};
    Object.keys(s.c).forEach(function (k) {
      var on = !!s.c[k];
      c[k] = on; n[k] = !on; cs[k] = on ? CFG.CHON : CFG.CHOFF; ap[k] = on ? 'true' : 'false';
      tog[k] = function () { var p = {}; p[k] = !self.cur().c[k]; up('c', p); };
    });
    var parts = [s.v.org || 'Origen'];
    CFG.stops.forEach(function (st2) { if (s.c[st2[0]]) parts.push(st2[1]); });
    parts.push(s.v.dst || 'Destino');
    var desc = s.v.desc || '';
    var bad = /(\d[\s.-]?){7,}|https?:|www\.|@\w/.test(desc);
    var declOk = !!(s.c.d1 && s.c.d2 && s.c.d3);
    var X = (function () {  return {}; })();
    return Object.assign({
      v: s.v, set: set, r: r, pick: pick, st: st, cst: cst, apr: apr,
      c: c, n: n, tog: tog, cs: cs, ap: ap,
      count: s.count, atMin: s.count <= CFG.lo, atMax: s.count >= CFG.hi,
      dec: function () { var k = self.cur().count; if (k > CFG.lo) self.setState({ count: k - 1 }); },
      inc: function () { var k = self.cur().count; if (k < CFG.hi) self.setState({ count: k + 1 }); },
      swap: function () { var cv = self.cur().v; up('v', { org: cv.dst, dst: cv.org }); },
      toast: s.toast,
      save: function () { self.setState({ toast: true }); setTimeout(function () { self.setState({ toast: false }); }, 1800); },
      routeText: parts.join('  →  '),
      len: desc.length, bad: bad, good: !bad, taStyle: bad ? CFG.ERRTA : '',
      declOk: declOk, declNo: !declOk
    }, X);
  }
}
</script>
</body>
</html>
