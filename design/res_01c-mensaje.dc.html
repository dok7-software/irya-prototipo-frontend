<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Escribir al conductor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#251D44}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #251D44; font-family: 'IBM Plex Sans', system-ui, sans-serif;">
<div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 6px; border-bottom: 1px solid #E4E1EE; flex: none;">
<a href="res_Main.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #251D44;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="font-size: 16px; font-weight: 700;">Reservar</div>
<span style="width: 44px;"></span>
</div>


<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 18px 20px; overflow: hidden;">
<div style="margin: -18px -20px 0; height: 70px; background: #251D44; opacity: 0.45; flex: none;"></div>
<div style="margin: -18px -20px 0; padding: 12px 20px 0; border-radius: 18px 18px 0 0; background: #FFFFFF; box-shadow: 0 -6px 18px rgba(37,29,68,0.15); display: flex; flex-direction: column; gap: 14px; flex-grow: 1;">
<div style="width: 40px; height: 4px; border-radius: 2px; background: #E4E1EE; align-self: center;"></div>
<div><h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em;">Escribir a Marco</h1></div>
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="desc" style="font-size: 14px; font-weight: 600;">Tu mensaje</label><textarea id="desc" value="{{ v.desc }}" onChange="{{ set.desc }}" placeholder="Ej.: ¿puedes recogerme en el óvalo?" style="min-height: 130px; box-sizing: border-box; border: 1.5px solid #A9A4BC; border-radius: 10px; padding: 12px 14px; font-family: inherit; font-size: 16px; line-height: 1.5; color: #251D44; resize: none; width: 100%; {{ taStyle }}"></textarea>
<sc-if value="{{ bad }}" hint-placeholder-val="{{ true }}"><div style="display: flex; gap: 6px; font-size: 13px; color: #B3261E; line-height: 1.4;"><span style="display: flex; flex: none; margin-top: 1px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg></span><span>No puedes compartir teléfonos ni redes. El mensaje no se envía y queda registrado.</span></div></sc-if>
<sc-if value="{{ good }}" hint-placeholder-val="{{ true }}"><div style="font-size: 13px; color: #5B5670;">El conductor responde desde la app. No hace falta reservar para escribirle.</div></sc-if></div>
</div>
</div>
<div style="flex: none; display: flex; flex-direction: column; gap: 10px; padding: 14px 20px 24px; border-top: 1px solid #E4E1EE;">
<sc-if value="{{ good }}" hint-placeholder-val="{{ true }}"><a href="res_Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none; box-sizing: border-box; background: #251D44; color: #FFFFFF;">Enviar mensaje</a></sc-if><sc-if value="{{ bad }}" hint-placeholder-val="{{ true }}"><button type="button" disabled="disabled" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none; box-sizing: border-box; width: 100%; border: none; background: #E4E1EE; color: #6E6985; font-family: inherit;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg>Enviar mensaje</button></sc-if>
</div>
<sc-if value="{{ toast }}" hint-placeholder-val="{{ true }}"><div style="position: absolute; left: 20px; right: 20px; bottom: 96px; display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: #251D44; color: #FFFFFF; font-size: 14px; font-weight: 600;"><span style="display: flex; color: #D1F383;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>Borrador guardado</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  data() { return { INIT: {"v": {"desc": ""}, "r": {}, "c": {}, "count": 0, "toast": false}, CFG: {"opts": {}, "stops": [], "lo": 0, "hi": 0, "SEL": "border: 2px solid #251D44; background: #F3FBE1;", "UNSEL": "border: 1.5px solid #E4E1EE; background: #FFFFFF;", "CHON": "background: #D1F383; border: 1.5px solid #251D44; color: #251D44;", "CHOFF": "background: #FFFFFF; border: 1.5px solid #E4E1EE; color: #251D44;", "ERRTA": "border-color: #B3261E; background: #FCEEEE;"} }; }
  cur() {
    var INIT = this.data().INIT;
    var s = this.state || {};
    return {
      v: Object.assign({}, INIT.v, s.v || {}),
      r: Object.assign({}, INIT.r, s.r || {}),
      c: Object.assign({}, INIT.c, s.c || {}),
      count: (s.count === undefined ? INIT.count : s.count),
      toast: !!s.toast
    };
  }
  renderVals() {
    var self = this;
    var CFG = this.data().CFG;
    var s = this.cur();
    function up(key, patch) { var c = self.cur(); var o = {}; o[key] = Object.assign({}, c[key], patch); self.setState(o); }
    var set = {};
    Object.keys(s.v).forEach(function (k) { set[k] = function (e) { var p = {}; p[k] = e.target.value; up('v', p); }; });
    var r = {}, pick = {}, st = {}, cst = {}, apr = {};
    Object.keys(CFG.opts).forEach(function (g) {
      CFG.opts[g].forEach(function (id) {
        var k = g + '_' + id, on = s.r[g] === id;
        r[k] = on; st[k] = on ? CFG.SEL : CFG.UNSEL; cst[k] = on ? CFG.CHON : CFG.CHOFF; apr[k] = on ? 'true' : 'false';
        pick[k] = function () { var p = {}; p[g] = id; up('r', p); };
      });
    });
    var c = {}, n = {}, tog = {}, cs = {}, ap = {};
    Object.keys(s.c).forEach(function (k) {
      var on = !!s.c[k];
      c[k] = on; n[k] = !on; cs[k] = on ? CFG.CHON : CFG.CHOFF; ap[k] = on ? 'true' : 'false';
      tog[k] = function () { var p = {}; p[k] = !self.cur().c[k]; up('c', p); };
    });
    var parts = [s.v.org || 'Origen'];
    CFG.stops.forEach(function (st2) { if (s.c[st2[0]]) parts.push(st2[1]); });
    parts.push(s.v.dst || 'Destino');
    var desc = s.v.desc || '';
    var bad = /(\d[\s.-]?){7,}|https?:|www\.|@\w/.test(desc);
    var declOk = !!(s.c.d1 && s.c.d2 && s.c.d3);
    var X = (function () {  return {}; })();
    return Object.assign({
      v: s.v, set: set, r: r, pick: pick, st: st, cst: cst, apr: apr,
      c: c, n: n, tog: tog, cs: cs, ap: ap,
      count: s.count, atMin: s.count <= CFG.lo, atMax: s.count >= CFG.hi,
      dec: function () { var k = self.cur().count; if (k > CFG.lo) self.setState({ count: k - 1 }); },
      inc: function () { var k = self.cur().count; if (k < CFG.hi) self.setState({ count: k + 1 }); },
      swap: function () { var cv = self.cur().v; up('v', { org: cv.dst, dst: cv.org }); },
      toast: s.toast,
      save: function () { self.setState({ toast: true }); setTimeout(function () { self.setState({ toast: false }); }, 1800); },
      routeText: parts.join('  →  '),
      len: desc.length, bad: bad, good: !bad, taStyle: bad ? CFG.ERRTA : '',
      declOk: declOk, declNo: !declOk
    }, X);
  }
}
</script>
</body>
</html>
