<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Confirma tu correo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#251D44}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #251D44; font-family: 'IBM Plex Sans', system-ui, sans-serif;">
<div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 6px; border-bottom: 1px solid #E4E1EE; flex: none;">
<a href="reg_02-correo.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #251D44;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 19l-7-7 7-7"></path></svg></a>
<div style="font-size: 16px; font-weight: 700;">Confirma tu correo</div>
<span style="width: 44px;"></span>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding: 48px 28px 0; overflow: hidden;">
<span style="width: 72px; height: 72px; border-radius: 36px; background: #EEEBFD; color: #251D44; display: flex; align-items: center; justify-content: center; flex: none;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></span>
<h1 style="margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em;">Te enviamos un enlace</h1>
<p style="margin: 0; font-size: 15px; color: #5B5670; line-height: 1.5;">Ábrelo desde el correo que escribiste para confirmar tu cuenta.</p>
<sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 13.5px; color: #251D44; font-weight: 600;">Enviamos el enlace de nuevo.</p></sc-if>
<sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ resend }}" style="background: none; border: none; font-family: inherit; font-size: 14px; font-weight: 600; color: #251D44; cursor: pointer; padding: 8px;">Reenviar enlace</button></sc-if>
</div>
<div style="flex: none; display: flex; flex-direction: column; gap: 10px; padding: 14px 20px 24px; border-top: 1px solid #E4E1EE;">
<a href="reg_04-telefono.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none; box-sizing: border-box; background: #251D44; color: #FFFFFF;">Ya confirmé mi correo</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var sent = !!s.sent;
    return {
      sent: sent, notSent: !sent,
      resend: function () { self.setState({ sent: true }); }
    };
  }
}
</script>
</body>
</html>
