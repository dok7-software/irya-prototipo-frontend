<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crear cuenta con correo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#251D44}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #251D44; font-family: 'IBM Plex Sans', system-ui, sans-serif;">
<div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 6px; border-bottom: 1px solid #E4E1EE; flex: none;">
<a href="Main.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #251D44;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 19l-7-7 7-7"></path></svg></a>
<div style="font-size: 16px; font-weight: 700;">Crear cuenta</div>
<span style="width: 44px;"></span>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 18px 20px 0; overflow: hidden;">
<div><h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em;">Tu correo y una clave</h1><p style="margin: 6px 0 0; font-size: 15px; color: #5B5670; line-height: 1.45;">Los usarás para entrar a RUTA la próxima vez.</p></div>
<div style="display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="email" style="font-size: 14px; font-weight: 600;">Correo</label><input id="email" type="email" placeholder="tunombre@correo.com" value="{{ v.email }}" onChange="{{ set.email }}" style="height: 48px; box-sizing: border-box; border: 1.5px solid {{ emailBorder }}; border-radius: 10px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #251D44; background: #FFFFFF; width: 100%;"><sc-if value="{{ emailTouched }}" hint-placeholder-val="{{ false }}"><sc-if value="{{ emailBad }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12.5px; color: #B3261E;">Escribe un correo válido.</span></sc-if></sc-if></div>
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="pass" style="font-size: 14px; font-weight: 600;">Clave</label><input id="pass" type="password" placeholder="Mínimo 6 caracteres" value="{{ v.pass }}" onChange="{{ set.pass }}" style="height: 48px; box-sizing: border-box; border: 1.5px solid {{ passBorder }}; border-radius: 10px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #251D44; background: #FFFFFF; width: 100%;"><span style="font-size: 12.5px; color: #6E6985;">Al menos 6 caracteres.</span></div>
</div>
</div>
<div style="flex: none; display: flex; flex-direction: column; gap: 10px; padding: 14px 20px 24px; border-top: 1px solid #E4E1EE;">
<a href="reg_03-confirmar-correo.dc.html" onClick="{{ guard }}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none; box-sizing: border-box; {{ btnStyle }}">Continuar</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  cur() {
    var s = this.state || {};
    return { v: Object.assign({ email: '', pass: '' }, s.v || {}), touched: Object.assign({}, s.touched || {}) };
  }
  renderVals() {
    var self = this;
    var s = this.cur();
    var set = {
      email: function (e) { self.setState({ v: Object.assign({}, self.cur().v, { email: e.target.value }), touched: Object.assign({}, self.cur().touched, { email: true }) }); },
      pass: function (e) { self.setState({ v: Object.assign({}, self.cur().v, { pass: e.target.value }) }); }
    };
    var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.v.email);
    var passOk = s.v.pass.length >= 6;
    var valid = emailOk && passOk;
    var emailTouched = !!s.touched.email;
    var emailBad = emailTouched && !emailOk && s.v.email.length > 0;
    return {
      v: s.v, set: set,
      emailTouched: emailTouched, emailBad: emailBad,
      emailBorder: emailBad ? '#B3261E' : '#A9A4BC', passBorder: '#A9A4BC',
      valid: valid,
      btnStyle: valid ? 'background: #251D44; color: #FFFFFF;' : 'background: #E4E1EE; color: #6E6985; pointer-events: none;',
      guard: function (e) { if (!valid) { e.preventDefault(); } }
    };
  }
}
</script>
</body>
</html>
