<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editar perfil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#251D44}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #251D44; font-family: 'IBM Plex Sans', system-ui, sans-serif;">
<div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 6px; border-bottom: 1px solid #E4E1EE; flex: none;"><a href="hub_p_perfil.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #251D44;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><div style="font-size: 16px; font-weight: 700;">Editar perfil</div><span style="width: 44px;"></span></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 14px 20px 18px; overflow: hidden;">
<div style="display: flex; align-items: center; gap: 14px;">
<span style="width: 72px; height: 72px; border-radius: 36px; background: #EEEBFD; color: #251D44; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; flex: none;">LR</span>
<label for="foto" style="height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border: 1.5px solid #251D44; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Cambiar foto<input type="file" id="foto" accept="image/*" style="display: none;"></label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; font-weight: 600;">Nombre</span><input type="text" value="{{ v.nom }}" onChange="{{ set.nom }}" placeholder="" disabled="disabled" style="height: 48px; padding: 0 14px; border: 1.5px solid #E4E1EE; border-radius: 12px; font-family: inherit; font-size: 16px; color: #251D44; background: #F6F5FA; box-sizing: border-box;"><span style="font-size: 12px; color: #5B5670;">Verificado con tu DNI: para cambiarlo, escribe a soporte.</span></label>
<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; font-weight: 600;">Celular</span><input type="text" value="{{ v.cel }}" onChange="{{ set.cel }}" placeholder="999 999 999" style="height: 48px; padding: 0 14px; border: 1.5px solid #E4E1EE; border-radius: 12px; font-family: inherit; font-size: 16px; color: #251D44; background: #FFFFFF; box-sizing: border-box;"></label>
<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; font-weight: 600;">Correo</span><input type="text" value="{{ v.mail }}" onChange="{{ set.mail }}" placeholder="tu@correo.com" style="height: 48px; padding: 0 14px; border: 1.5px solid #E4E1EE; border-radius: 12px; font-family: inherit; font-size: 16px; color: #251D44; background: #FFFFFF; box-sizing: border-box;"></label>
<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; font-weight: 600;">Sobre ti <span style="font-weight: 400; color: #5B5670;">(lo ven los conductores)</span></span>
<textarea value="{{ v.bio }}" onChange="{{ set.bio }}" rows="3" style="padding: 12px 14px; border: 1.5px solid #E4E1EE; border-radius: 12px; font-family: inherit; font-size: 15px; color: #251D44; resize: none; box-sizing: border-box;"></textarea>
<span style="font-size: 12px; color: #5B5670;">Sin teléfonos, enlaces ni redes · {{ bioLen }}/200</span></label>
</div>
<div style="flex: none; display: flex; flex-direction: column; gap: 10px; padding: 14px 20px 24px; border-top: 1px solid #E4E1EE;"><a href="hub_p_perfil.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none; box-sizing: border-box; background: #251D44; color: #FFFFFF;">Guardar cambios</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  data() { return { INIT: {"v": {"nom": "Lucía Rojas", "cel": "945 274 118", "mail": "lucia.rojas@correo.com", "bio": "Viajo a Ica una vez al mes por trabajo. Puntual y tranquila."}, "c": {}} }; }
  cur() { var s = this.state || {}; return { v: Object.assign({}, this.data().INIT.v, s.v || {}), c: Object.assign({}, this.data().INIT.c, s.c || {}) }; }
  renderVals() {
    var self = this, s = this.cur();
    var set = {}; Object.keys(s.v).forEach(function (k) { set[k] = function (e) { var p = Object.assign({}, self.cur().v); p[k] = e.target.value; self.setState({ v: p }); }; });
    var tog = {}, n = {}; Object.keys(s.c).forEach(function (k) { n[k] = !s.c[k]; tog[k] = function () { var p = Object.assign({}, self.cur().c); p[k] = !p[k]; self.setState({ c: p }); }; });
    var num = String(s.v.num || '').replace(/\D/g, '');
    return { v: s.v, set: set, c: s.c, n: n, tog: tog, last4: num.slice(-4) || '0000', bioLen: String(s.v.bio || '').length,
      saveCard: function () { var p = Object.assign({}, self.cur().c); p.form = false; p.added = true; self.setState({ c: p }); } };
  }
}
</script>
</body>
</html>
