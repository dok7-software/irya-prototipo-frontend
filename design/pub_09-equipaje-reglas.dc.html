<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Condiciones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#251D44}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #251D44; font-family: 'IBM Plex Sans', system-ui, sans-serif;">
<div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 6px; border-bottom: 1px solid #E4E1EE; flex: none;">
<a href="pub_07-fecha-hora.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #251D44;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="font-size: 16px; font-weight: 700;">Publicar viaje</div>
<button type="button" onClick="{{ save }}" style="height: 44px; padding: 0 10px; background: none; border: none; font-family: inherit; font-size: 14px; font-weight: 600; color: #251D44; cursor: pointer;">Guardar</button>
</div>
<div style="padding: 14px 20px 0; flex: none;">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #5B5670;"><span>Paso 4 de 6</span><span style="font-weight: 700; color: #251D44;">Condiciones</span></div>
<div style="height: 6px; background: #EEEBFD; border-radius: 3px; margin-top: 8px;"><div style="width: 66.7%; height: 6px; background: #251D44; border-radius: 3px;"></div></div>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 18px 20px; overflow: hidden;">
<div><h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em;">Condiciones del viaje</h1></div><div style="display: flex; flex-direction: column; gap: 8px;"><div style="font-size: 14px; font-weight: 600;">Equipaje por pasajero</div><div style="display: flex; gap: 8px; flex-wrap: wrap;"><button type="button" aria-pressed="{{ apr.eq_e1 }}" onClick="{{ pick.eq_e1 }}" style="height: 40px; padding: 0 14px; border-radius: 20px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; {{ cst.eq_e1 }}">Solo mochila</button><button type="button" aria-pressed="{{ apr.eq_e2 }}" onClick="{{ pick.eq_e2 }}" style="height: 40px; padding: 0 14px; border-radius: 20px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; {{ cst.eq_e2 }}">Maleta mediana</button><button type="button" aria-pressed="{{ apr.eq_e3 }}" onClick="{{ pick.eq_e3 }}" style="height: 40px; padding: 0 14px; border-radius: 20px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; {{ cst.eq_e3 }}">Maleta grande</button></div></div><div><div style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-size: 14px; font-weight: 600;">Reglas del viaje</span><span style="font-size: 12px; color: #5B5670;">Precargadas de tu perfil</span></div><label for="r1" style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #E4E1EE; cursor: pointer;"><input type="checkbox" id="r1" checked="{{ c.r1 }}" onChange="{{ tog.r1 }}" style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #251D44; flex: none;"><span style="font-size: 15px; line-height: 1.4;">Se aceptan mascotas</span></label><label for="r2" style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #E4E1EE; cursor: pointer;"><input type="checkbox" id="r2" checked="{{ c.r2 }}" onChange="{{ tog.r2 }}" style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #251D44; flex: none;"><span style="font-size: 15px; line-height: 1.4;">Se permite fumar</span></label><label for="r3" style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #E4E1EE; cursor: pointer;"><input type="checkbox" id="r3" checked="{{ c.r3 }}" onChange="{{ tog.r3 }}" style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #251D44; flex: none;"><span style="font-size: 15px; line-height: 1.4;">Hago paradas en ruta</span></label></div><div style="display: flex; flex-direction: column; gap: 6px;"><label for="desc" style="font-size: 14px; font-weight: 600;">Mensaje para los pasajeros <span style="font-weight: 400; color: #5B5670;">(opcional)</span></label><textarea id="desc" value="{{ v.desc }}" onChange="{{ set.desc }}" placeholder="Ej.: salgo puntual, hay espacio para una maleta extra…" style="min-height: 110px; box-sizing: border-box; border: 1.5px solid #A9A4BC; border-radius: 10px; padding: 12px 14px; font-family: inherit; font-size: 16px; line-height: 1.5; color: #251D44; resize: none; width: 100%; {{ taStyle }}"></textarea>
<sc-if value="{{ bad }}" hint-placeholder-val="{{ true }}"><div style="display: flex; gap: 6px; align-items: flex-start; font-size: 13px; color: #B3261E; line-height: 1.4;"><span style="display: flex; flex: none; margin-top: 1px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg></span><span>Detectamos un teléfono, enlace o usuario. Elimínalo para continuar.</span></div></sc-if>
<sc-if value="{{ good }}" hint-placeholder-val="{{ true }}"><div style="display: flex; justify-content: space-between; font-size: 13px; color: #5B5670;"><span>Sin teléfonos, enlaces ni redes.</span><span>{{ len }}/300</span></div></sc-if></div>
</div>
<div style="flex: none; display: flex; flex-direction: column; gap: 10px; padding: 14px 20px 24px; border-top: 1px solid #E4E1EE;">
<sc-if value="{{ good }}" hint-placeholder-val="{{ true }}"><a href="pub_11-precio.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none; box-sizing: border-box; background: #251D44; color: #FFFFFF;">Continuar</a></sc-if><sc-if value="{{ bad }}" hint-placeholder-val="{{ true }}"><button type="button" disabled="disabled" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none; box-sizing: border-box; width: 100%; border: none; background: #E4E1EE; color: #6E6985; font-family: inherit;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg>Continuar</button></sc-if>
</div>
<sc-if value="{{ toast }}" hint-placeholder-val="{{ true }}"><div style="position: absolute; left: 20px; right: 20px; bottom: 96px; display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: #251D44; color: #FFFFFF; font-size: 14px; font-weight: 600;"><span style="display: flex; color: #D1F383;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>Borrador guardado</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  data() { return { INIT: {"v": {"desc": ""}, "r": {"eq": "e2"}, "c": {"r1": false, "r2": false, "r3": true}, "count": 0, "toast": false}, CFG: {"opts": {"eq": ["e1", "e2", "e3"]}, "stops": [], "lo": 0, "hi": 0, "SEL": "border: 2px solid #251D44; background: #F3FBE1;", "UNSEL": "border: 1.5px solid #E4E1EE; background: #FFFFFF;", "CHON": "background: #D1F383; border: 1.5px solid #251D44; color: #251D44;", "CHOFF": "background: #FFFFFF; border: 1.5px solid #E4E1EE; color: #251D44;", "ERRTA": "border-color: #B3261E; background: #FCEEEE;"} }; }
  cur() {
    var INIT = this.data().INIT;
    var s = this.state || {};
    return {
      v: Object.assign({}, INIT.v, s.v || {}),
      r: Object.assign({}, INIT.r, s.r || {}),
      c: Object.assign({}, INIT.c, s.c || {}),
      count: (s.count === undefined ? INIT.count : s.count),
      toast: !!s.toast
    };
  }
  renderVals() {
    var self = this;
    var CFG = this.data().CFG;
    var s = this.cur();
    function up(key, patch) { var c = self.cur(); var o = {}; o[key] = Object.assign({}, c[key], patch); self.setState(o); }
    var set = {};
    Object.keys(s.v).forEach(function (k) { set[k] = function (e) { var p = {}; p[k] = e.target.value; up('v', p); }; });
    var r = {}, pick = {}, st = {}, cst = {}, apr = {};
    Object.keys(CFG.opts).forEach(function (g) {
      CFG.opts[g].forEach(function (id) {
        var k = g + '_' + id, on = s.r[g] === id;
        r[k] = on; st[k] = on ? CFG.SEL : CFG.UNSEL; cst[k] = on ? CFG.CHON : CFG.CHOFF; apr[k] = on ? 'true' : 'false';
        pick[k] = function () { var p = {}; p[g] = id; up('r', p); };
      });
    });
    var c = {}, n = {}, tog = {}, cs = {}, ap = {};
    Object.keys(s.c).forEach(function (k) {
      var on = !!s.c[k];
      c[k] = on; n[k] = !on; cs[k] = on ? CFG.CHON : CFG.CHOFF; ap[k] = on ? 'true' : 'false';
      tog[k] = function () { var p = {}; p[k] = !self.cur().c[k]; up('c', p); };
    });
    var parts = [s.v.org || 'Origen'];
    CFG.stops.forEach(function (st2) { if (s.c[st2[0]]) parts.push(st2[1]); });
    parts.push(s.v.dst || 'Destino');
    var desc = s.v.desc || '';
    var bad = /(\d[\s.-]?){7,}|https?:|www\.|@\w/.test(desc);
    var declOk = !!(s.c.d1 && s.c.d2 && s.c.d3);
    var X = (function () {  return {}; })();
    return Object.assign({
      v: s.v, set: set, r: r, pick: pick, st: st, cst: cst, apr: apr,
      c: c, n: n, tog: tog, cs: cs, ap: ap,
      count: s.count, atMin: s.count <= CFG.lo, atMax: s.count >= CFG.hi,
      dec: function () { var k = self.cur().count; if (k > CFG.lo) self.setState({ count: k - 1 }); },
      inc: function () { var k = self.cur().count; if (k < CFG.hi) self.setState({ count: k + 1 }); },
      swap: function () { var cv = self.cur().v; up('v', { org: cv.dst, dst: cv.org }); },
      toast: s.toast,
      save: function () { self.setState({ toast: true }); setTimeout(function () { self.setState({ toast: false }); }, 1800); },
      routeText: parts.join('  →  '),
      len: desc.length, bad: bad, good: !bad, taStyle: bad ? CFG.ERRTA : '',
      declOk: declOk, declNo: !declOk
    }, X);
  }
}
</script>
</body>
</html>
