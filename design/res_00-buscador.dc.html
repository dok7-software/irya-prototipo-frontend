<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px;"><div style="display: flex; flex-direction: column; gap: 6px;"><label for="org" style="font-size: 14px; font-weight: 600;">Origen</label><div style="position: relative; display: flex; align-items: center;"><span style="position: absolute; left: 14px; display: flex; color: #5B5670;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0119 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></span><input id="org" type="text" value="{{ v.org }}" onChange="{{ set.org }}" style="height: 48px; box-sizing: border-box; border: 1.5px solid #A9A4BC; border-radius: 10px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #251D44; background: #FFFFFF; width: 100%; padding-left: 42px; "></div></div><div style="display: flex; flex-direction: column; gap: 6px;"><label for="dst" style="font-size: 14px; font-weight: 600;">Destino</label><div style="position: relative; display: flex; align-items: center;"><span style="position: absolute; left: 14px; display: flex; color: #5B5670;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0119 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></span><input id="dst" type="text" value="{{ v.dst }}" onChange="{{ set.dst }}" style="height: 48px; box-sizing: border-box; border: 1.5px solid #A9A4BC; border-radius: 10px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #251D44; background: #FFFFFF; width: 100%; padding-left: 42px; "></div></div></div>
<button type="button" aria-label="Intercambiar origen y destino" onClick="{{ swap }}" style="width: 44px; height: 44px; margin-top: 22px; flex: none; border-radius: 22px; border: 1.5px solid #E4E1EE; background: #FFFFFF; color: #251D44; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M4 7l3-3 3 3M17 20V4M14 17l3 3 3-3"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;"><a href="res_00c-calendario.dc.html" style="text-decoration: none; color: inherit;"><div style="display: flex; flex-direction: column; gap: 6px;"><label for="fecha" style="font-size: 14px; font-weight: 600;">Fecha</label><div style="position: relative; display: flex; align-items: center;"><span style="position: absolute; left: 14px; display: flex; color: #5B5670;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></span><input id="fecha" type="text" value="{{ v.fecha }}" onChange="{{ set.fecha }}" style="height: 48px; box-sizing: border-box; border: 1.5px solid #A9A4BC; border-radius: 10px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #251D44; background: #FFFFFF; width: 100%; padding-left: 42px; "></div></div></a><div style="display: flex; flex-direction: column; gap: 6px;"><label for="pax" style="font-size: 14px; font-weight: 600;">Pasajeros</label><div style="position: relative; display: flex; align-items: center;"><span style="position: absolute; left: 14px; display: flex; color: #5B5670;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16v-4l2-5h14l2 5v4H3z"></path><circle cx="7.5" cy="16.5" r="1.8"></circle><circle cx="16.5" cy="16.5" r="1.8"></circle></svg></span><input id="pax" type="text" value="{{ v.pax }}" onChange="{{ set.pax }}" style="height: 48px; box-sizing: border-box; border: 1.5px solid #A9A4BC; border-radius: 10px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #251D44; background: #FFFFFF; width: 100%; padding-left: 42px; "></div></div></div>
</div><div style="display: flex; flex-direction: column; gap: 10px;"><div style="font-size: 14px; font-weight: 600;">Búsquedas recientes</div><div style="display: flex; flex-direction: column; gap: 8px;"><a href="res_01-resultados.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1.5px solid #E4E1EE; border-radius: 12px; color: #251D44; text-decoration: none;"><span style="display: flex; color: #5B5670;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600;">Lima → Ica</span><span style="font-size: 13px; color: #5B5670;">vie 9 oct</span></a><a href="res_01-resultados.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1.5px solid #E4E1EE; border-radius: 12px; color: #251D44; text-decoration: none;"><span style="display: flex; color: #5B5670;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600;">Lima → Asia</span><span style="font-size: 13px; color: #5B5670;">sáb 10 oct</span></a></div></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border: 1.5px dashed #A698F2; border-radius: 12px;">
<div style="font-size: 15px; font-weight: 600;">¿No encuentras tu día?</div>

</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  data() { return { INIT: {"v": {"org": "Lima", "dst": "Ica", "fecha": "Vie 9 oct", "pax": "1 pasajero"}, "r": {}, "c": {}, "count": 0, "toast": false}, CFG: {"opts": {}, "stops": [], "lo": 0, "hi": 0, "SEL": "border: 2px solid #251D44; background: #F3FBE1;", "UNSEL": "border: 1.5px solid #E4E1EE; background: #FFFFFF;", "CHON": "background: #D1F383; border: 1.5px solid #251D44; color: #251D44;", "CHOFF": "background: #FFFFFF; border: 1.5px solid #E4E1EE; color: #251D44;", "ERRTA": "border-color: #B3261E; background: #FCEEEE;"} }; }
  cur() {
    var INIT = this.data().INIT;
    var s = this.state || {};
    return {
      v: Object.assign({}, INIT.v, s.v || {}),
      r: Object.assign({}, INIT.r, s.r || {}),
      c: Object.assign({}, INIT.c, s.c || {}),
      count: (s.count === undefined ? INIT.count : s.count),
      toast: !!s.toast
    };
  }
  renderVals() {
    var self = this;
    var CFG = this.data().CFG;
    var s = this.cur();
    function up(key, patch) { var c = self.cur(); var o = {}; o[key] = Object.assign({}, c[key], patch); self.setState(o); }
    var set = {};
    Object.keys(s.v).forEach(function (k) { set[k] = function (e) { var p = {}; p[k] = e.target.value; up('v', p); }; });
    var r = {}, pick = {}, st = {}, cst = {}, apr = {};
    Object.keys(CFG.opts).forEach(function (g) {
      CFG.opts[g].forEach(function (id) {
        var k = g + '_' + id, on = s.r[g] === id;
        r[k] = on; st[k] = on ? CFG.SEL : CFG.UNSEL; cst[k] = on ? CFG.CHON : CFG.CHOFF; apr[k] = on ? 'true' : 'false';
        pick[k] = function () { var p = {}; p[g] = id; up('r', p); };
      });
    });
    var c = {}, n = {}, tog = {}, cs = {}, ap = {};
    Object.keys(s.c).forEach(function (k) {
      var on = !!s.c[k];
      c[k] = on; n[k] = !on; cs[k] = on ? CFG.CHON : CFG.CHOFF; ap[k] = on ? 'true' : 'false';
      tog[k] = function () { var p = {}; p[k] = !self.cur().c[k]; up('c', p); };
    });
    var parts = [s.v.org || 'Origen'];
    CFG.stops.forEach(function (st2) { if (s.c[st2[0]]) parts.push(st2[1]); });
    parts.push(s.v.dst || 'Destino');
    var desc = s.v.desc || '';
    var bad = /(\d[\s.-]?){7,}|https?:|www\.|@\w/.test(desc);
    var declOk = !!(s.c.d1 && s.c.d2 && s.c.d3);
    var X = (function () {  return {}; })();
    return Object.assign({
      v: s.v, set: set, r: r, pick: pick, st: st, cst: cst, apr: apr,
      c: c, n: n, tog: tog, cs: cs, ap: ap,
      count: s.count, atMin: s.count <= CFG.lo, atMax: s.count >= CFG.hi,
      dec: function () { var k = self.cur().count; if (k > CFG.lo) self.setState({ count: k - 1 }); },
      inc: function () { var k = self.cur().count; if (k < CFG.hi) self.setState({ count: k + 1 }); },
      swap: function () { var cv = self.cur().v; up('v', { org: cv.dst, dst: cv.org }); },
      toast: s.toast,
      save: function () { self.setState({ toast: true }); setTimeout(function () { self.setState({ toast: false }); }, 1800); },
      routeText: parts.join('  →  '),
      len: desc.length, bad: bad, good: !bad, taStyle: bad ? CFG.ERRTA : '',
      declOk: declOk, declNo: !declOk
    }, X);
  }
}
</script>
