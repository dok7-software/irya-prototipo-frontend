<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  data() { return { INIT: {"v": {}, "r": {}, "c": {"copied": false}, "count": 0, "toast": false}, CFG: {"opts": {}, "stops": [], "lo": 0, "hi": 0, "SEL": "border: 2px solid #251D44; background: #F3FBE1;", "UNSEL": "border: 1.5px solid #E4E1EE; background: #FFFFFF;", "CHON": "background: #D1F383; border: 1.5px solid #251D44; color: #251D44;", "CHOFF": "background: #FFFFFF; border: 1.5px solid #E4E1EE; color: #251D44;", "ERRTA": "border-color: #B3261E; background: #FCEEEE;"} }; }
  cur() {
    var INIT = this.data().INIT;
    var s = this.state || {};
    return {
      v: Object.assign({}, INIT.v, s.v || {}),
      r: Object.assign({}, INIT.r, s.r || {}),

    var self = this;

    var s = this.cur();

        var k = g + '_' + id, on = s.r[g] === id;

    CFG.stops.forEach(function (st2) { if (s.c[st2[0]]) parts.push(st2[1]); });

    var desc = s.v.desc || '';

    var declOk = !!(s.c.d1 && s.c.d2 && s.c.d3);

      routeText: parts.join('  →  '),

  }
}
