"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 11v6M12 7.5v.5\"><\/path><\/svg><\/span><div>En efectivo no hay cobro al reservar. Si no te presentas, no se te cobra nada, pero recibes una calificación negativa y el conductor pierde el asiento.<\/div><\/div>\n<\/div>\n<div style=\"flex: none; display: flex; flex-direction: column; gap: 10px; padding: 14px 20px 24px; border-top: 1px solid #E4E1EE;\">\n<sc-if value=\"{{ digital }}\" hint-placeholder-val=\"{{ true }}\"><a href=\"res_04-resumen-tarjeta.dc.html\" style=\"display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none; box-sizing: border-box; background: #251D44; color: #FFFFFF;\">Continuar<\/a><\/sc-if><sc-if value=\"{{ cash }}\" hint-placeholder-val=\"{{ true }}\"><a href=\"res_04b-resumen-efectivo.dc.html\" style=\"display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none; box-sizing: border-box; background: #251D44; color: #FFFFFF;\">Continuar<\/a><\/sc-if>\n<\/div>\n<sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"position: absolute; left: 20px; right: 20px; bottom: 96px; display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: #251D44; color: #FFFFFF; font-size: 14px; font-weight: 600;\"><span style=\"display: flex; color: #D1F383;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg><\/span>Borrador guardado<\/div><\/sc-if>\n<\/div>"</script>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  data() { return { INIT: {"v": {}, "r": {"pm": "m1"}, "c": {}, "count": 0, "toast": false}, CFG: {"opts": {"pm": ["m1", "m2", "m3"]}, "stops": [], "lo": 0, "hi": 0, "SEL": "border: 2px solid #251D44; background: #F3FBE1;", "UNSEL": "border: 1.5px solid #E4E1EE; background: #FFFFFF;", "CHON": "background: #D1F383; border: 1.5px solid #251D44; color: #251D44;", "CHOFF": "background: #FFFFFF; border: 1.5px solid #E4E1EE; color: #251D44;", "ERRTA": "border-color: #B3261E; background: #FCEEEE;"} }; }
  cur() {
    var INIT = this.data().INIT;
    var s = this.state || {};
    return {
      v: Object.assign({}, INIT.v, s.v || {}),
      r: Object.assign({}, INIT.r, s.r || {}),
      c: Object.assign({}, INIT.c, s.c || {}),
      count: (s.count === undefined ? INIT.count : s.count),
      toast: !!s.toast
    };
  }
  renderVals() {
    var self = this;
    var CFG = this.data().CFG;
    var s = this.cur();
    function up(key, patch) { var c = self.cur(); var o = {}; o[key] = Object.assign({}, c[key], patch); self.setState(o); }
    var set = {};
    Object.keys(s.v).forEach(function (k) { set[k] = function (e) { var p = {}; p[k] = e.target.value; up('v', p); }; });
    var r = {}, pick = {}, st = {}, cst = {}, apr = {};
    Object.keys(CFG.opts).forEach(function (g) {
      CFG.opts[g].forEach(function (id) {
        var k = g + '_' + id, on = s.r[g] === id;
        r[k] = on; st[k] = on ? CFG.SEL : CFG.UNSEL; cst[k] = on ? CFG.CHON : CFG.CHOFF; apr[k] = on ? 'true' : 'false';
        pick[k] = function () { var p = {}; p[g] = id; up('r', p); };
      });
    });
    var c = {}, n = {}, tog = {}, cs = {}, ap = {};
    Object.keys(s.c).forEach(function (k) {
      var on = !!s.c[k];
      c[k] = on; n[k] = !on; cs[k] = on ? CFG.CHON : CFG.CHOFF; ap[k] = on ? 'true' : 'false';
      tog[k] = function () { var p = {}; p[k] = !self.cur().c[k]; up('c', p); };
    });
    var parts = [s.v.org || 'Origen'];
    CFG.stops.forEach(function (st2) { if (s.c[st2[0]]) parts.push(st2[1]); });
    parts.push(s.v.dst || 'Destino');
    var desc = s.v.desc || '';
    var bad = /(\d[\s.-]?){7,}|https?:|www\.|@\w/.test(desc);
    var declOk = !!(s.c.d1 && s.c.d2 && s.c.d3);
    var X = (function () { if (true) return { cash: s.r.pm === 'm3', digital: s.r.pm !== 'm3' }; return {}; })();
    return Object.assign({
      v: s.v, set: set, r: r, pick: pick, st: st, cst: cst, apr: apr,
      c: c, n: n, tog: tog, cs: cs, ap: ap,
      count: s.count, atMin: s.count <= CFG.lo, atMax: s.count >= CFG.hi,
      dec: function () { var k = self.cur().count; if (k > CFG.lo) self.setState({ count: k - 1 }); },
      inc: function () { var k = self.cur().count; if (k < CFG.hi) self.setState({ count: k + 1 }); },
      swap: function () { var cv = self.cur().v; up('v', { org: cv.dst, dst: cv.org }); },
      toast: s.toast,
      save: function () { self.setState({ toast: true }); setTimeout(function () { self.setState({ toast: false }); }, 1800); },
      routeText: parts.join('  →  '),
      len: desc.length, bad: bad, good: !bad, taStyle: bad ? CFG.ERRTA : '',
      declOk: declOk, declNo: !declOk
    }, X);
  }
}
</script>
