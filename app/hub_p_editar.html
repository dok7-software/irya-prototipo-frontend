lex-direction: column; gap: 6px;\"><span style=\"font-size: 13px; font-weight: 600;\">Nombre<\/span><input type=\"text\" value=\"{{ v.nom }}\" onChange=\"{{ set.nom }}\" placeholder=\"\" disabled=\"disabled\" style=\"height: 48px; padding: 0 14px; border: 1.5px solid #E4E1EE; border-radius: 12px; font-family: inherit; font-size: 16px; color: #251D44; background: #F6F5FA; box-sizing: border-box;\"><span style=\"font-size: 12px; color: #5B5670;\">Verificado con tu DNI: para cambiarlo, escribe a soporte.<\/span><\/label>\n<label style=\"display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-size: 13px; font-weight: 600;\">Celular<\/span><input type=\"text\" value=\"{{ v.cel }}\" onChange=\"{{ set.cel }}\" placeholder=\"999 999 999\" style=\"height: 48px; padding: 0 14px; border: 1.5px solid #E4E1EE; border-radius: 12px; font-family: inherit; font-size: 16px; color: #251D44; background: #FFFFFF; box-sizing: border-box;\"><\/label>\n<label style=\"display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-size: 13px; font-weight: 600;\">Correo<\/span><input type=\"text\" value=\"{{ v.mail }}\" onChange=\"{{ set.mail }}\" placeholder=\"tu@correo.com\" style=\"height: 48px; padding: 0 14px; border: 1.5px solid #E4E1EE; border-radius: 12px; font-family: inherit; font-size: 16px; color: #251D44; background: #FFFFFF; box-sizing: border-box;\"><\/label>\n<label style=\"display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-size: 13px; font-weight: 600;\">Sobre ti <span style=\"font-weight: 400; color: #5B5670;\">(lo ven los conductores)<\/span><\/span>\n<textarea value=\"{{ v.bio }}\" onChange=\"{{ set.bio }}\" rows=\"3\" style=\"padding: 12px 14px; border: 1.5px solid #E4E1EE; border-radius: 12px; font-family: inherit; font-size: 15px; color: #251D44; resize: none; box-sizing: border-box;\"><\/textarea>\n<span style=\"font-size: 12px; color: #5B5670;\">Sin teléfonos, enlaces ni redes · {{ bioLen }}/200<\/span><\/label>\n<\/div>\n<div s <script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  data() { return { INIT: {"v": {"nom": "Lucía Rojas", "cel": "945 274 118", "mail": "lucia.rojas@correo.com", "bio": "Viajo a Ica una vez al mes por trabajo. Puntual y tranquila."}, "c": {}} }; }

  renderVals() {
    var self = this, s = this.cur();
    var set = {}; Object.keys(s.v).forEach(function (k) { set[k] = function (e) { var p = Object.assign({}, self.cur().v); p[k] = e.target.value; self.setState({ v: p }); }; });
    var tog = {}, n = {}; Object.keys(s.c).forEach(function (k) { n[k] = !s.c[k]; tog[k] = function () { var p = Object.assign({}, self.cur().c); p[k] = !p[k]; self.setState({ c: p }); }; });
    var num = String(s.v.num || '').replace(/\D/g, '');
    return { v: s.v, set: set, c: s.c, n: n, tog: tog, last4: num.slice(-4) || '0000', bioLen: String(s.v.bio || '').length,
      saveCard: function () { var p = Object.assign({}, self.cur().c); p.form = false; p.added = true; self.setState({ c: p }); } };
  }
